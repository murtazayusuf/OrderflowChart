[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflowchart"
version = "0.2.0"
description = "Footprint (order flow) charts in Python with Plotly"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Murtaza Yusuf Ali" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5", "plotly>=5.9"]
keywords = ["orderflow", "footprint", "trading", "plotly", "market-microstructure"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
live = ["dash>=2"]
image = ["kaleido"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/murtazayusuf/OrderflowChart"
Issues = "https://github.com/murtazayusuf/OrderflowChart/issues"

[tool.setuptools]
packages = ["OrderFlow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
